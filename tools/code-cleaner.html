llection of 22 browser-based developer utilities. Project details and technical case studies are available on his portfolio at https://asmatrahman.github.io/projects.\"}},{\"@type\":\"Question\",\"name\":\"How can I hire Asmat Rahman or discuss a software development project?\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"You can contact Asmat Rahman through the contact form on his portfolio or email him directly at info.asmatrahman@gmail.com. You can also explore his previous work through GitHub at https://github.com/asmatrahman or connect with him on LinkedIn at https://www.linkedin.com/in/asmatrahman.\"}}]}]}c:X\nf:[[\"children\",{\"s\":\"__PAGE__\",\"h\":512,\"d\":{\"r\":\"$L10\",\"p\":false,\"v\":null}}]]\nd:[[\"children\",{\"s\":\"code-cleaner\",\"h\":512,\"d\":{\"r\":\"$Le\",\"p\":false,\"v\":\"$c\"},\"c\":\"$Qf\"}]]\na:[[\"children\",{\"s\":\"tools\",\"h\":512,\"d\":{\"r\":\"$Lb\",\"p\":false,\"v\":\"$c\"},\"c\":\"$Qd\"}]]\n0:{\"P\":null,\"c\":[\"\",\"tools\",\"code-cleaner\"],\"q\":\"\",\"i\":false,\"t\":{\"t\":{\"s\":\"\",\"h\":528,\"d\":{\"r\":[\"$\",\"$1\",\"c\",{\"children\":[[[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/_next/static/chunks/2bp3j_fk9lwik.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}],[\"$\",\"script\",\"script-0\",{\"src\":\"/_next/static/chunks/2wgdk4w873wj-.js\",\"async\":true,\"nonce\":\"$undefined\"}],[\"$\",\"script\",\"script-1\",{\"src\":\"/_next/static/chunks/2lh39atzyoh4q.js\",\"async\":true,\"nonce\":\"$undefined\"}],[\"$\",\"script\",\"script-2\",{\"src\":\"/_next/static/chunks/0jm8a_37_f2o1.js\",\"async\":true,\"nonce\":\"$undefined\"}],[\"$\",\"script\",\"script-3\",{\"src\":\"/_next/static/chunks/3ios-mpl05d-a.js\",\"async\":true,\"nonce\":\"$undefined\"}],[\"$\",\"script\",\"script-4\",{\"src\":\"/_next/static/chunks/1h2r84dviyd1u.js\",\"async\":true,\"nonce\":\"$undefined\"}]],[\"$\",\"html\",null,{\"lang\":\"en\",\"suppressHydrationWarning\":true,\"children\":
